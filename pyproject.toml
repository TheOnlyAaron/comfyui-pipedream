[project]
name = "comfyui-pipedream"
version = "0.2.0"
description = "Production pipeline utility nodes for ComfyUI — token-based output and loading on local and network paths, wedges, video utilities, OCIO color and LUTs, sound cues and switching."
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aaron Dabelow" }]
dependencies = ["opencolorio>=2.3"]

