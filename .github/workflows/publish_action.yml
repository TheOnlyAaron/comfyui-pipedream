name: Publish to Comfy registry

# Publishes the version in pyproject.toml whenever a change to that file
# lands on main (or on demand). A published version can't be replaced, so
# bump the version for every release.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'TheOnlyAaron' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.COMFYUI_PUBLISH_PIPEDREAM }}
